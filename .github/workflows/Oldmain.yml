name: Update Reels Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'Videos/Reels/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          reels_dir = Path("Videos/Reels")
          manifest_path = reels_dir / "manifest.json"

          video_extensions = {
              ".mp4",
              ".webm",
              ".mov",
              ".m4v",
              ".avi"
          }

          videos = sorted(
              [
                  file.name
                  for file in reels_dir.iterdir()
                  if file.is_file()
                  and file.suffix.lower() in video_extensions
              ],
              key=str.lower
          )

          manifest_path.write_text(
              json.dumps(videos, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"Found {len(videos)} video(s).")
          print(f"Manifest: {manifest_path}")
          PY

      - name: Commit manifest if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Videos/Reels/manifest.json

          if git diff --cached --quiet; then
            echo "No manifest changes."
          else
            git commit -m "chore: update reels manifest"
            git push
          fi
